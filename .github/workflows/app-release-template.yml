name: Build and Release Thea Installer

on:
  push:
    tags:
      - 'v*.*.*' # Trigger when you push a version tag like v0.1.0, v0.2.0
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          if (Test-Path Thea.spec) {
            pyinstaller --noconfirm Thea.spec
          } elseif (Test-Path main.py) {
            pyinstaller --noconfirm --onedir --windowed --name Thea main.py
          } else {
            Write-Error "Could not find Thea.spec or main.py"
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Inno Setup Script
        shell: pwsh
        run: |
          if (Test-Path installer.iss) {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } elseif (Test-Path setup.iss) {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          } else {
            Write-Warning "No installer .iss script found. Skipping installer step."
          }

      - name: Compute SHA-256 Checksums
        id: artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path Output\*.exe, dist\*.exe -Recurse -ErrorAction SilentlyContinue
          if ($files) {
            $primary = $files[0]
            $hash = (Get-FileHash -Path $primary.FullName -Algorithm SHA256).Hash
            echo "PRIMARY_NAME=$($primary.Name)" >> $env:GITHUB_OUTPUT
            echo "PRIMARY_HASH=$hash" >> $env:GITHUB_OUTPUT
            echo "PRIMARY_SIZE=$($primary.Length)" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/*.exe
            dist/*.exe
          generate_release_notes: true
          body: |
            ### Automated Build Information
            - **Installer**: `${{ steps.artifacts.outputs.PRIMARY_NAME }}`
            - **SHA-256**: `${{ steps.artifacts.outputs.PRIMARY_HASH }}`
            - **Size (bytes)**: `${{ steps.artifacts.outputs.PRIMARY_SIZE }}`

